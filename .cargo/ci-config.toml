# Cargo automatically reads config.toml, not ci-config.toml. CI copies this file
# to ../.cargo/config.toml so Cargo merges it with the repository's .cargo/config.toml.
# The repository's config takes precedence for scalar values set in both files.
# Arrays merge rather than replace one another.
# See https://doc.rust-lang.org/cargo/reference/config.html#hierarchical-structure
#
# Keep CI-only settings here. For example, -D warnings makes warnings fail CI builds
# without requiring developers to use that stricter setting in local builds.
#
# Use Cargo config instead of RUSTFLAGS, which overrides configured rustflags and
# can hide invalid settings in config.toml.
# See https://github.com/rust-lang/cargo/issues/5376
#
# Use [target.'cfg(all())'] to accumulate flags from matching target configurations.
# [build] does not provide the same cumulative behavior.
[target.'cfg(all())']
rustflags = ["-D", "warnings"]

# Limit debug information for CI tests and dev builds.
[profile.dev]
debug = "limited"
