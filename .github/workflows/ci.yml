# Main CI workflow
name: CI

# TODO: Setup coverage using cargo-mutants, but only for minor/major version bumps (would probably take hours :() -- also our testing infra sucks

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.x']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # Change detection
  orchestrate:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
      run_style: ${{ steps.filter.outputs.run_style }}
      run_docs:  ${{ steps.filter.outputs.run_docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.ref == 'refs/heads/main' && 2 || 350 }}
      - id: filter
        run: |
          if [ -z "$GITHUB_BASE_REF" ]; then
            COMPARE_REV="$(git rev-parse HEAD~1)"
          else
            git fetch origin "$GITHUB_BASE_REF" --depth=350
            COMPARE_REV="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          fi
          CHANGED_FILES="$(git diff --name-only "$COMPARE_REV" "$GITHUB_SHA")"

          check_pattern() {
            local name="$1" pattern="$2" invert="${3:-false}"
            if [ "$invert" = "true" ]; then
              echo "$CHANGED_FILES" | grep -qvP "$pattern" && echo "${name}=true" >> "$GITHUB_OUTPUT" || echo "${name}=false" >> "$GITHUB_OUTPUT"
            else
              echo "$CHANGED_FILES" | grep -qP  "$pattern" && echo "${name}=true" >> "$GITHUB_OUTPUT" || echo "${name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check_pattern "run_tests" '^(docs/|\.github/(ISSUE_TEMPLATE|workflows/)|README\.md|CHANGELOG\.md)' true
          check_pattern "run_style" '\.(rs|toml)$|rust-toolchain\.toml|\.cargo/|clippy\.toml|typos\.toml'
          check_pattern "run_docs"  '^docs/|\.rs$'

  # Formatting
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just fmt-check

  # Clippy
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just clippy

  # Spell check
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1.47.2
        with:
          config: typos.toml

  # TOML formatting
  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: uncenter/setup-taplo@v1
      - run: taplo fmt --check

  # Lockfile freshness is advisory: dependency resolution changes often come
  # from upstream releases and should be reviewed, not block unrelated work.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check root lockfile freshness (warning only)
        shell: bash
        run: |
          warn() {
            echo "::warning title=Lockfile freshness::$1"
          }

          if ! cargo update; then
            warn "Could not refresh Cargo.lock; inspect dependency resolution."
          elif ! git diff --quiet -- Cargo.lock; then
            git diff -- Cargo.lock
            warn "Cargo.lock changed after cargo update; refresh it in a dedicated dependency update."
          fi

  # Unused dependencies
  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-machete
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just machete

  # MSRV
  msrv:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just msrv-check

  # WASM target (nightly + atomics)
  check-wasm:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly toolchain with rust-src and WASM target
        run: rustup toolchain install nightly --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just check-wasm-atomics

  # Linux build + test
  test-linux:
    runs-on: ubuntu-latest
    needs: [orchestrate]
    if: needs.orchestrate.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libfontconfig-dev
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just build
      - run: just test
      - run: just test-doc

  # macOS build + test
  test-mac:
    runs-on: macos-latest
    needs: [orchestrate]
    if: needs.orchestrate.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just build
      - run: just test
      - run: just test-doc

  # Windows build + test
  test-windows:
    runs-on: windows-latest
    needs: [orchestrate]
    if: needs.orchestrate.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just build
      - run: just test

  # Examples
  check-examples:
    runs-on: ubuntu-latest
    needs: [orchestrate]
    if: github.event_name == 'pull_request' && needs.orchestrate.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just check-examples

  # Compare against the PR base rather than crates.io. This reports only API
  # regressions introduced by the PR, including regressions that would break
  # downstream users such as our gpui-component fork.
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # GitHub otherwise checks out a synthetic merge commit. Checking the
          # PR head directly makes the comparison exactly base..PR, so API
          # breaks already present on main are not reported again.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev
      - name: Check gpui-ce's public API against the PR base
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: gpui-ce
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          feature-group: default-features
          # This is an API-diff gate, not a release-type waiver. Keep the
          # patch policy so an incompatibility introduced by this PR is shown
          # and fails here; the reserved next-major release record does not
          # make unrelated main-branch breaks part of this PR.
          release-type: patch

  # Components live in their own repository. Check current main against this
  # checkout, but make drift visible as annotations rather than a merge gate.
  components:
    runs-on: ubuntu-latest
    needs: [orchestrate]
    if: needs.orchestrate.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: gpui-ce/gpui-component
          path: gpui-component
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libfontconfig-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev
      - name: Check component compatibility (warning only)
        shell: bash
        run: |
          component_dir="$GITHUB_WORKSPACE/gpui-component"
          component_patch_args=(
            --config "patch.crates-io.gpui-ce.path=\"$GITHUB_WORKSPACE/crates/gpui\""
            --config "patch.crates-io.gpui_ce_platform.path=\"$GITHUB_WORKSPACE/crates/gpui_platform\""
            --config "patch.crates-io.gpui_ce_web.path=\"$GITHUB_WORKSPACE/crates/gpui_web\""
            --config "patch.crates-io.gpui_ce_macros.path=\"$GITHUB_WORKSPACE/crates/gpui_macros\""
          )
          warn() {
            echo "::warning title=Component compatibility::$1"
          }

          if ! (cd "$component_dir" && cargo "${component_patch_args[@]}" build --workspace --all-targets); then
            warn "gpui-ce/gpui-component main does not currently build against this GPUI checkout."
          elif ! (cd "$component_dir" && cargo "${component_patch_args[@]}" test --workspace --no-fail-fast); then
            warn "gpui-ce/gpui-component tests do not currently pass against this GPUI checkout."
          fi

  # Beta toolchain (scheduled only)
  beta-test:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: rustup update beta && rustup default beta
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just check
      - run: just test

  # Gate job
  tests-pass:
    if: always()
    needs:
      - fmt
      - clippy
      - typos
      - taplo
      - lockfile
      - machete
      - msrv
      - check-wasm
      - test-linux
      - test-mac
      - test-windows
      - check-examples
      - semver
      - components
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          EXIT_CODE=0
          check_result() {
            echo "* $1: $2"
            if [[ "$2" != "skipped" && "$2" != "success" ]]; then EXIT_CODE=1; fi
          }
          check_result fmt            ${{ needs.fmt.result }}
          check_result clippy         ${{ needs.clippy.result }}
          check_result typos          ${{ needs.typos.result }}
          check_result taplo          ${{ needs.taplo.result }}
          check_result lockfile       ${{ needs.lockfile.result }}
          check_result machete        ${{ needs.machete.result }}
          check_result msrv           ${{ needs.msrv.result }}
          check_result check-wasm     ${{ needs.check-wasm.result }}
          check_result test-linux     ${{ needs.test-linux.result }}
          check_result test-mac       ${{ needs.test-mac.result }}
          check_result test-windows   ${{ needs.test-windows.result }}
          check_result check-examples ${{ needs.check-examples.result }}
          check_result semver         ${{ needs.semver.result }}
          check_result components     ${{ needs.components.result }}
          exit $EXIT_CODE
