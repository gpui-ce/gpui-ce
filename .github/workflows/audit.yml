# Security audit workflow
name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # cargo-audit: vulnerability scanning (advisory DB)
  cargo-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory: ['.', 'crates/gpui_ce_components']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.working-directory }}

  # cargo-deny: license compliance + advisory + duplicate detection
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest-path: ['./Cargo.toml', './crates/gpui_ce_components/Cargo.toml']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest-path }}
