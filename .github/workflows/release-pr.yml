name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, stable MAJOR.MINOR.PATCH (e.g. 0.4.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      # Pull requests opened with the default GITHUB_TOKEN do not trigger CI.
      # Provide a PAT or GitHub App token as RELEASE_PR_TOKEN so the required
      # checks run on the release PR (see MAINTENANCE.md).
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - run: just release-pr-open "$VERSION"
