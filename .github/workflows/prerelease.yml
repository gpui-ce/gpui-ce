# Publish the development snapshots for the next committed gpui-ce release.
# Every publishable workspace crate is published at the same crates.io-only
# version, in dependency order. No alpha tag or alpha-version commit is created
# in this repository.
name: Publish prerelease

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  # crates.io versions are IMMUTABLE, so alpha numbers must be allocated in
  # order even when main receives several commits in quick succession!
  group: gpui-ce-registry-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - id: version
        name: Allocate the next crates.io alpha version
        run: just alpha-version "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - name: Publish every crate in dependency order
        run: just alpha-publish "$VERSION" "$HEAD_SHA"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  smoke:
    # Prove the published set resolves and compiles for a consumer.
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: hustcer/setup-nu@v3
      - uses: extractions/setup-just@v2
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xinput-dev libxkbcommon-x11-dev libfontconfig-dev
      - name: Compile a fresh consumer crate against the snapshot
        run: just alpha-smoke "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
