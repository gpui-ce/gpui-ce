[workspace]
members = [
    "./crates/gpui/",
    "./crates/gpui_web/",
    "./crates/gpui_wgpu/",
    "./crates/gpui_linux/",
    "./crates/gpui_macos/",
    "./crates/gpui_tokio/",
    "./crates/gpui_macros/",
    "./crates/gpui_windows/",
    "./crates/gpui_platform/",
    "./crates/gpui_shared_string/",
    "./crates/gpui_wasm_thread/",
    "./crates/xim/",
    "./crates/xim_parser/",
    "./crates/xim_ctext/",
    "./crates/gpui_elements/",
    "./crates/gpui_collections/",
    "./crates/gpui_refineable/",
    "./crates/gpui_derive_refineable/",
    "./crates/gpui_scheduler/",
    "./crates/gpui_sum_tree/",
    "./crates/gpui_media/",
    "./crates/gpui_zed_util/",
    "./crates/gpui_ce_util/",
    "./crates/gpui_path/",
    "./tooling/perf/",
]
default-members = ["./crates/gpui/"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "A community fork of Zed's GPU-accelerated UI framework"
publish = true
license = "Apache-2.0"
homepage = "https://gpui-ce.github.io/"
readme = "README.md"
rust-version = "1.97"

[workspace.dependencies]
accesskit = { version = "0.24", features = ["enumn"] }
accesskit_macos = "0.26"
accesskit_unix = "0.22"
accesskit_windows = "0.34"
anyhow = "1"
backtrace = "0.3"
bitflags = { version = "2", default-features = false }
collections = { path = "./crates/gpui_collections/", version = "0.2.2", package = "gpui_ce_collections" }
ctor = "1.0"
unicode-bidi = { version = "0.3", default-features = false, features = [
    "hardcoded-data",
] }
derive_more = { version = "2.1", features = [
  "add",
  "add_assign",
  "deref",
  "deref_mut",
  "display",
  "from_str",
  "mul",
  "mul_assign",
  "not",
] }
dunce = "1.0"
futures = "0.3"
futures-concurrency = "7.7"
http = "1"
image = "0.25"
inventory = "0.3"
itertools = "0.15"
log = { version = "0.4", features = ["serde"] }
palette = { version = "0.7", features = ["serializing"] }
parking_lot = "0.12"
postage = { version = "0.5", features = ["futures-traits"] }
proptest = { version = "1.11", features = ["attr-macro"] }
chrono = { version = "0.4", features = ["serde"] }
profiling = "1"
rand = "0.10"
regex = "1"
refineable = { path = "./crates/gpui_refineable/", version = "0.2.2", package = "gpui_ce_refineable" }
scheduler = { path = "./crates/gpui_scheduler/", version = "0.2.2", package = "gpui_ce_scheduler" }
schemars = { version = "1.2", features = ["indexmap2"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
slotmap = "1.1"
smallvec = { version = "1", features = ["union", "const_new"] }
async-channel = "2.5"
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
sum_tree = { path = "./crates/gpui_sum_tree/", version = "0.2.2", package = "gpui_ce_sum_tree" }
thiserror = "2"
hdrhistogram = "7"
pollster = "1"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
web-time = "1.1"
cocoa = "=0.26.1"
cocoa-foundation = "=0.2.1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-video = { version = "0.6", features = ["metal"] }
media = { path = "./crates/gpui_media/", version = "0.2.2", package = "gpui_ce_media" }
objc = "0.2"
block2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSUndoManager",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-user-notifications = "0.3"
mach2 = "0.6"
metal = "0.33"
env_logger = "0.11"
unicode-segmentation = "1.13"
wasm-bindgen = "0.2"
notify-rust = "4"
heck = "0.5"
proc-macro2 = "1"
syn = { version = "3", features = ["full", "extra-traits", "visit-mut"] }
quote = "1"
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "notification",
    "open_uri",
    "file_chooser",
    "settings",
    "trash"
] }
libc = "0.2"
smol = "2"
wgpu = "29.0.4"
criterion = { version = "0.8", features = ["html_reports"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
semver = { version = "1", features = ["serde"] }
windows-core = "0.62"
tokio = { version = "1" }
gpui_util = { path = "./crates/gpui_ce_util/", version = "0.2.6", package = "gpui_ce_util" }
xim = { path = "./crates/xim/", package = "gpui_xim" }

ahash = { version = "0.8", default-features = false }
as-raw-xcb-connection = "1"
async-task = "4.7"
bindgen = "0.72"
block = "0.1"
bytemuck = "1"
calloop = "0.14"
calloop-wayland-source = "0.4"
cbindgen = { version = "0.29", default-features = false }
console_error_panic_hook = "0.1"
core-graphics = "0.25"
core-text = "22"
cosmic-text = "0.19"
dispatch2 = "0.3"
embed-resource = "3"
encoding_rs = "0.8"
etagere = "0.3"
filedescriptor = "0.8"
font-kit = { git = "https://github.com/Havunen/font-kit", rev = "cc6f86949e40ef3a5e9b2063f8127cdcb72d7ac4", package = "font-kit", version = "0.14.3-1" }
foreign-types = "0.5"
getrandom = "0.4"
hashbrown = { version = "0.17", default-features = false }
heapless = "0.9"
js-sys = "0.3"
lyon = "1"
num_cpus = "1"
objc2 = "0.6"
objc2-metal = "0.3"
oo7 = { version = "0.6", default-features = false }
open = "5"
parking = "2"
pathfinder_geometry = "0.5"
pin-project = "1"
raw-window-handle = "0.6"
resvg = { version = "0.48", default-features = false }
seahash = "4"
smol_str = "0.3"
spin = "0.12"
swash = "0.2"
taffy = { version = "=0.12.2", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "calc", "content_size", "detailed_layout_info"] }
skrifa = "0.46"
usvg = { version = "0.48", default-features = false }
waker-fn = "1.2"
wasm-bindgen-futures = "0.4"
# Vendored: upstream is unmaintained and its published worker bootstrap still
# calls the wasm-bindgen init function with the positional arguments deprecated
# in 0.2.93. See crates/gpui_wasm_thread/README.md for the local patch.
wasm_thread = { path = "./crates/gpui_wasm_thread/", package = "gpui_wasm_thread" }
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-cursor = "0.31"
wayland-protocols = "0.32"
wayland-protocols-plasma = "0.3"
wayland-protocols-wlr = "0.3"
web-sys = "0.3"
windows-numerics = "0.3"
windows-registry = "0.6"
x11 = "2.21"
x11-clipboard = "0.9"
x11-dl = "2.21"
x11rb = "0.14"
xkbcommon = "0.9"

gpui = { path = "./crates/gpui/", version = "0.2.2", package = "gpui-ce" }
gpui_platform = { path = "./crates/gpui_platform/", version = "0.1.0", package = "gpui_ce_platform" }
gpui_linux = { path = "./crates/gpui_linux/", version = "0.1.0", package = "gpui_ce_linux" }
gpui_macos = { path = "./crates/gpui_macos/", version = "0.1.0", package = "gpui_ce_macos" }
gpui_windows = { path = "./crates/gpui_windows/", version = "0.1.0", package = "gpui_ce_windows" }
gpui_web = { path = "./crates/gpui_web/", version = "0.1.0", package = "gpui_ce_web" }

gpui_wgpu = { path = "./crates/gpui_wgpu/", version = "0.1.0", package = "gpui_ce_wgpu" }

gpui_macros = { path = "./crates/gpui_macros/", version = "0.1.0", package = "gpui_ce_macros" }
gpui_shared_string = { path = "./crates/gpui_shared_string/", version = "0.1.0", package = "gpui_ce_shared_string" }
gpui_tokio = { path = "./crates/gpui_tokio/", version = "0.1.0", package = "gpui_ce_tokio" }

[workspace.dependencies.windows]
version = "0.62.2"
features = [
  "Foundation_Numerics",
  "Globalization_DateTimeFormatting",
  "Storage_Search",
  "Storage_Streams",
  "System_Threading",
  "UI_ViewManagement",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectManipulation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Hlsl",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Pipes",
  "Win32_System_RestartManager",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media",
  "Data",
  "Data_Xml",
  "Data_Xml_Dom",
  "Win32_Storage_Packaging",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_JobObjects",
  "UI_Notifications",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
