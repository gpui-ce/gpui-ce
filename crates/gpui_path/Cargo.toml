[package]
name = "gpui_path"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "Relative/absolute path types used by gpui-ce (vendored from Zed's path crate)."
repository = "https://github.com/gpui-ce/gpui-ce"

[lib]
name = "path"
path = "src/path.rs"

[features]
test-support = []

[dependencies]
anyhow = "1"
dunce = "1.0"
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
tempfile = "3.27"
