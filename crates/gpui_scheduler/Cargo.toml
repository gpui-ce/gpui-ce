[package]
name = "gpui_ce_scheduler"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "Async task scheduler/executor for gpui-ce (vendored from Zed)."

[lib]
name = "scheduler"
path = "src/scheduler.rs"
doctest = false

[features]
test-support = []
# Enables `spawn_dedicated` web workers on wasm. Requires shared-memory threading
# with atomics and bulk-memory. Disabled by default so builds without those flags
# compile, though `spawn_dedicated` then panics at runtime.
#
# `flume/spin` replaces its mutex with a spinlock because scheduling sends from the
# browser main thread, where a contended mutex's `Atomics.wait` is forbidden.
wasm-threads = ["dep:wasm_thread", "flume/spin"]

[dependencies]
async-task.workspace = true
backtrace.workspace = true
chrono.workspace = true
flume.workspace = true
futures.workspace = true
parking_lot.workspace = true
rand.workspace = true
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# Forked because upstream is unmaintained and its worker bootstrap still calls
# the wasm-bindgen init function with the positional arguments deprecated in 0.2.93.
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = [
  "es_modules",
], optional = true }
