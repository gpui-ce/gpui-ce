[package]
name = "gpui_ce_parley"
version = "0.3.1"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = ["system-fonts"]
system-fonts = ["fontique/system", "parley/system"]
fontconfig-dlopen = ["fontique/fontconfig-dlopen"]
test-support = ["gpui/test-support", "dep:gpui_fonts"]

[dependencies]
anyhow.workspace = true
fontique = { workspace = true, features = ["std"] }
gpui = { path = "../gpui", version = "0.3.1", package = "gpui-ce", default-features = false }
gpui_fonts = { path = "../gpui_ce_fonts", version = "0.3.1", package = "gpui-ce-fonts", optional = true }
parking_lot.workspace = true
parley = { workspace = true, features = ["complex-scripts"] }
skrifa = { workspace = true, features = ["std"] }
unicode-segmentation.workspace = true

[dev-dependencies]
collections.workspace = true
criterion.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_fonts = { path = "../gpui_ce_fonts", version = "0.3.1", package = "gpui-ce-fonts" }

[[bench]]
name = "text_pipeline"
harness = false
