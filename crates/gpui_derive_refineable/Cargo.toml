[package]
name = "gpui_ce_derive_refineable"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "Derive macro for gpui-ce's Refineable (vendored from Zed)."

[lib]
name = "derive_refineable"
path = "src/derive_refineable.rs"
proc-macro = true
doctest = false

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits", "visit-mut"] }
